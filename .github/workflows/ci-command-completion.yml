name: CI command completion

on:
  workflow_run:
    workflows: ['CI command worker', 'ci-command *']
    types: [completed]

permissions: {}

jobs:
  route:
    if: >-
      github.event.workflow_run.path == '.github/workflows/ci-command-worker.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      group: ${{ steps.route.outputs.group }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and route completion without writing
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/comment_ci.py route

  control:
    needs: route
    if: needs.route.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    # Share the dispatcher's repository/command lock for ALL status writes.
    concurrency:
      group: ci-command-control-${{ needs.route.outputs.group }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile the validated completion
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ROUTE: ${{ needs.route.outputs.route }}
        run: python3 .github/ci/comment_ci.py control
