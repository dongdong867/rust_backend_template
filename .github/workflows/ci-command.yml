# Maintainer commands (/lint, /test, /test-{crate}); usage is in the README.
# Keep these rules when changing this workflow or ci-command-worker.yml:
# - The controller runs only trusted default-branch code and never checks out or runs the pull request.
# - Only commenters with write, maintain or admin permission are accepted, and edited comments are refused.
# - Jobs that run pull request code have read-only permissions and no secrets, and test only the captured head SHA.
#   That code can still write default-branch cache entries.
# - Only the controller and the worker's report job write commit statuses, and neither checks out pull request code.
# - `ci-command /test` is not a required check: GitHub matches required checks by name, and a fork PR
#   workflow also reports as GitHub Actions, so it could create a passing check with the same name.
# - actionlint 1.7.12 does not know `queue: max`; the ci-config-check target exempts only those two lock mappings.
name: CI command controller

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  route:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/lint' || startsWith(github.event.comment.body, '/test'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      group: ${{ steps.route.outputs.group }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize and route without writing
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/comment_ci.py route

  control:
    needs: route
    if: needs.route.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
      statuses: write
    # Internal request bookkeeping and cancellation share one repository/command lock.
    # Only this controller cancels bound obsolete workers; worker admission never cancels a run.
    concurrency:
      group: ci-command-control-${{ needs.route.outputs.group }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Accept and bind the latest request
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ROUTE: ${{ needs.route.outputs.route }}
        run: python3 .github/ci/comment_ci.py control
