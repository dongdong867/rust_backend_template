name: CI command controller

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  route:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/lint' || startsWith(github.event.comment.body, '/test'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      group: ${{ steps.route.outputs.group }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize and route without writing
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/comment_ci.py route

  control:
    needs: route
    if: needs.route.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
      statuses: write
    # Internal request bookkeeping and cancellation share one repository/command lock.
    # Only this controller cancels bound obsolete workers; worker admission never cancels a run.
    concurrency:
      group: ci-command-control-${{ needs.route.outputs.group }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Accept and bind the latest request
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ROUTE: ${{ needs.route.outputs.route }}
        run: python3 .github/ci/comment_ci.py control
