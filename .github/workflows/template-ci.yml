name: Template validation

on:
  pull_request:
    # Converting to draft cancels an older heavy run; its replacement job is skipped.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source and generated variants
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read project tool pins
        id: tools
        run: make --no-print-directory tool-versions >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Install prebuilt Taplo
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: taplo@${{ steps.tools.outputs.taplo }}
          fallback: none
      - name: Report disk before cache restore
        run: |
          # Temporary measurement of what fills the disk; the cache fix removes it.
          cat > "$RUNNER_TEMP/disk-report.sh" <<'REPORT'
          # A runner that fills its disk loses the log but keeps annotations.
          label=$1
          df -h "$GITHUB_WORKSPACE" /
          available() { df -Ph "$1" | awk 'NR == 2 { print $4 }'; }
          echo "::notice title=Disk $label::workspace $(available "$GITHUB_WORKSPACE") free, / $(available /) free"
          sizes=()
          for path in "$HOME/.cargo/registry" "$HOME/.cargo/git" target .tools/bin \
              .tools/.crates.toml .tools/.crates2.json \
              target/debug target/debug/incremental target/debug/deps target/template-test \
              target/template-test/debug/incremental target/template-test/debug/deps; do
            if [ -e "$path" ]; then size=$(du -sh "$path" | awk '{ print $1 }'); else size=missing; fi
            printf '%s\t%s\n' "$size" "$path"
            sizes+=("$path $size")
          done
          joined=$(printf '%s, ' "${sizes[@]}")
          echo "::notice title=Sizes $label::${joined%, }"
          REPORT
          bash "$RUNNER_TEMP/disk-report.sh" "before restore"
      - name: Restore optional build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache credential/configuration files or application environments.
          # Cargo install records must accompany the restored generator binary.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .tools/bin
            .tools/.crates.toml
            .tools/.crates2.json
          key: template-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Makefile', 'scripts/install_actionlint.py') }}
      - name: Report disk after cache restore
        run: bash "$RUNNER_TEMP/disk-report.sh" "after restore"
      - name: Install source verification tools
        run: make ci-tools template-tools
      - name: Validate actual workflow syntax
        run: make ci-config-check
      - name: Check main formatting
        if: github.event_name == 'push'
        run: make fmt-check fmt-toml-check
      - name: Clippy for all targets and features
        run: make clippy
      - name: Default compilation and fast tests
        run: make test FEATURES=
      - name: API documentation compilation and fast tests
        run: make test FEATURES=api-doc
      - name: Both generated variants and feature modes
        run: make template-test-fast
      - name: Report disk at job end
        if: always()
        run: bash "$RUNNER_TEMP/disk-report.sh" "at job end"
