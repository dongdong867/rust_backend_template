name: Template validation

on:
  pull_request:
    # Converting to draft cancels an older heavy run; its replacement job is skipped.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source and generated variants
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep the cached build small enough to restore on every runner; panics keep file and line.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read project tool pins
        id: tools
        run: make --no-print-directory tool-versions >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Install prebuilt Taplo
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: taplo@${{ steps.tools.outputs.taplo }}
          fallback: none
      - name: Install prebuilt cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@${{ steps.tools.outputs.cargo-deny }}
          fallback: none
      - name: Report free disk before cache restore
        # A runner that fills its disk during the restore keeps only this notice.
        run: |
          free=$(df -Ph "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          test -n "$free"
          echo "::notice title=Disk before restore::$free free on the workspace disk"
      - name: Restore optional build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never cache credential/configuration files or application environments.
          # Cargo install records must accompany the restored generator binary.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .tools/bin
            .tools/.crates.toml
            .tools/.crates2.json
          key: template-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Makefile', 'scripts/install_actionlint.py') }}
      - name: Report free disk after cache restore
        # Shows cache growth before it fills the disk.
        run: |
          free=$(df -Ph "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          test -n "$free"
          echo "::notice title=Disk after restore::$free free on the workspace disk"
      - name: Install source verification tools
        run: make ci-tools template-tools
      - name: Validate actual workflow syntax
        run: make ci-config-check
      - name: Check main formatting
        if: github.event_name == 'push'
        run: make fmt-check fmt-toml-check
      - name: Clippy for all targets and features
        run: make clippy
      - name: Default compilation and fast tests
        run: make test FEATURES=
      - name: API documentation compilation and fast tests
        run: make test FEATURES=api-doc
      - name: Both generated variants and feature modes
        run: make template-test-fast
      - name: Audit dependencies
        run: make audit
