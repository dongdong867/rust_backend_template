[package]
name = "rust-backend-template"
default-run = "rust-backend-template"
version = "0.1.0"
edition = "2024"
publish = false

[features]
api-doc = [
  "dep:actix-web-httpauth",
  "dep:subtle",
  "dep:utoipa",
  "dep:utoipa-swagger-ui",
  "environment/api-doc",
  "tasks/api-doc",
]

[dependencies]
actix-cors.workspace = true
actix-web.workspace = true
actix-web-httpauth = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
subtle = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true, features = ["actix_extras"] }
utoipa-swagger-ui = { workspace = true, optional = true }
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

environment.workspace = true
tasks.workspace = true

[dev-dependencies]
chrono.workspace = true
rcgen = "0.14.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
url.workspace = true
tasks = { workspace = true, features = ["test-support"] }
